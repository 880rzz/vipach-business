name: Steward canonical legal-name migration

on:
  push:
    branches:
      - steward/canonical-legal-name-20260910

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[identity-migrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: steward/canonical-legal-name-20260910
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/migrate-canonical-legal-name.mjs
      - run: git diff --check
      - shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "BANHALMI Steward"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Apply canonical legal name [identity-migrated]"
          git push origin HEAD:steward/canonical-legal-name-20260910
