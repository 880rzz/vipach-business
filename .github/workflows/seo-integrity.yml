name: SEO integrity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  seo-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical, hreflang, JSON-LD and legacy privacy links
        run: node scripts/check-seo-integrity.mjs
