name: SEO integrity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  seo-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical, hreflang, JSON-LD and legacy privacy links
        run: node .github/checks/check-seo-integrity.mjs
      - name: Validate multilingual Business entity, legal provider and public AI summaries
        run: node .github/checks/check-business-identity.mjs
      - name: Verify tracking is disabled and legacy Business identifiers expire locally
        run: node .github/checks/check-analytics-withdrawal.mjs
      - name: Verify multilingual problem, solution, deliverables and project origin
        run: node .github/checks/check-business-proposition.mjs
      - name: Verify shared editorial layout across the localized Business pages
        run: node .github/checks/check-editorial-layout.mjs
      - name: Verify allowlisted website artifact
        run: node .github/checks/build-publication.mjs "${RUNNER_TEMP}/vipach-business-public"
