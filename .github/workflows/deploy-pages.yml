name: Deploy VIPACH Business to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build public website artifact
        run: node .github/checks/build-publication.mjs "${RUNNER_TEMP}/vipach-business-public"
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/vipach-business-public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
